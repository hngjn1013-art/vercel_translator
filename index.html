<!DOCTYPE html>
<!-- deploy test -->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f4f2ee">
  <title>닝닝 번역 사이트</title>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="preconnect" href="https://translator-16b24-default-rtdb.firebaseio.com" crossorigin>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // 색 팔레트를 통째로 바꾼다: slate는 따뜻한 아이보리/회색, indigo와 emerald는 짙은 숲 초록.
    // 아래 화면 코드와 JS가 만드는 방 카드·말풍선은 기존 클래스 이름 그대로 새 색이 입혀진다.
    const forest = { 50:'#eaf1ed', 100:'#d9e6df', 200:'#b9d1c4', 300:'#8fb3a0', 400:'#5f9079', 500:'#3f7059', 600:'#2c5444', 700:'#234438', 800:'#1b352c', 900:'#12241d' };
    tailwind.config = { theme: { extend: { colors: {
      slate: { 50:'#f4f2ee', 100:'#ebe8e1', 200:'#e0dcd3', 300:'#cdc8bd', 400:'#9b978e', 500:'#76736b', 600:'#5a5851', 700:'#3e3d38', 800:'#25302b', 900:'#161b18' },
      indigo: forest, emerald: forest
    } } } };
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; background: #f4f2ee; color: #25302b; }
    .chat-scroll::-webkit-scrollbar { width: 6px; }
    .chat-scroll::-webkit-scrollbar-thumb { background-color: #cdc8bd; border-radius: 3px; }
    .floating-bar { box-shadow: 0 10px 30px rgba(37,48,43,.16), 0 2px 6px rgba(37,48,43,.08); }
    .soft-card { box-shadow: 0 1px 2px rgba(37,48,43,.05), 0 6px 18px rgba(37,48,43,.06); }
    @keyframes pulse-ring { 0% { transform: scale(.95); box-shadow: 0 0 0 0 rgba(239,68,68,.7); } 70% { transform: scale(1); box-shadow: 0 0 0 12px rgba(239,68,68,0); } 100% { transform: scale(.95); box-shadow: 0 0 0 0 rgba(239,68,68,0); } }
    .recording-active { animation: pulse-ring 1.5s infinite; background-color: #ef4444 !important; color: #fff !important; }
    .modal-backdrop { background: rgba(37,48,43,.4); backdrop-filter: blur(4px); }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .safe-bottom { padding-bottom: max(.75rem, env(safe-area-inset-bottom)); }
    .hdr-pill { display:inline-flex; align-items:center; gap:.5rem; height:2.6rem; padding:0 .85rem 0 .3rem; border-radius:9999px; background:#fff; border:0; box-shadow:0 1px 2px rgba(37,48,43,.06), 0 4px 12px rgba(37,48,43,.07); color:#25302b; font-size:.8125rem; font-weight:600; line-height:1.15; white-space:nowrap; max-width:100%; transition:background .15s,box-shadow .15s; }
    .hdr-pill:hover { background:#f7f5f1; box-shadow:0 2px 4px rgba(37,48,43,.08), 0 6px 16px rgba(37,48,43,.1); }
    .hdr-pill.lang { padding:0 .95rem; gap:.45rem; }
    .hdr-pill .pill-label { display:block; font-size:.625rem; font-weight:600; color:#76736b; }
    .hdr-pill .pill-name { display:block; font-size:.9rem; font-weight:700; color:#25302b; max-width:9rem; overflow:hidden; text-overflow:ellipsis; }
    .hdr-pill .pill-sub { color:#9b978e; font-size:.72rem; }
    .user-avatar { width:2rem; height:2rem; border-radius:9999px; display:inline-flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:.9rem; flex-shrink:0; }
    .ui-language-option.lang-active { background:#eaf1ed; color:#234438; font-weight:700; }
    #chatApp, #lobbyScreen { background:#f4f2ee; }
    #textInput { background:transparent; border:0; box-shadow:none; }
    .room-card:active { background:#e9efeb; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen max-w-2xl mx-auto relative">

  <!-- 채팅방 목록 화면 -->
  <section id="lobbyScreen" class="min-h-screen bg-slate-50 flex flex-col">
    <header class="px-5 pt-6 pb-2">
      <div class="min-w-0">
        <h1 id="lobbyTitle" class="font-extrabold text-slate-900 text-3xl tracking-tight leading-tight">AI 번역 채팅방</h1>
        <p id="lobbySubtitle" class="text-sm text-slate-500 mt-1.5">채팅방을 선택하거나 새로 만들어 보세요.</p>
      </div>
      <div class="flex items-center justify-between gap-2 mt-3">
        <button id="lobbyChangeUserBtn" type="button" class="hdr-pill min-w-0" title="ID">
          <span id="lobbyUserAvatar" class="user-avatar">U</span>
          <span class="min-w-0 text-left"><span id="lobbyMyIdLabel" class="pill-label">내 ID</span><span id="lobbyUserDisplay" class="pill-name">UserA</span></span>
          <i class="fa-solid fa-pen pill-sub"></i>
        </button>
        <div class="relative shrink-0">
          <button id="lobbyLanguageButton" type="button" class="hdr-pill lang" aria-haspopup="true"><i class="fa-solid fa-globe pill-sub" aria-hidden="true"></i><span id="lobbyLanguageName">한국어</span><i class="fa-solid fa-chevron-down pill-sub"></i></button>
          <div id="lobbyLanguagePopup" class="hidden absolute right-0 top-full mt-2 w-44 bg-white rounded-2xl floating-bar p-2 z-50">
            <p id="lobbyLanguagePopupTitle" class="text-xs text-slate-500 px-2 py-2">화면 언어 선택</p>
            <button type="button" data-ui-lang="ko" class="ui-language-option w-full text-left px-3 py-2 text-sm hover:bg-slate-100 rounded-xl">한국어</button>
            <button type="button" data-ui-lang="zh" class="ui-language-option w-full text-left px-3 py-2 text-sm hover:bg-slate-100 rounded-xl">繁體中文</button>
            <button type="button" data-ui-lang="ja" class="ui-language-option w-full text-left px-3 py-2 text-sm hover:bg-slate-100 rounded-xl">日本語</button>
            <button type="button" data-ui-lang="en" class="ui-language-option w-full text-left px-3 py-2 text-sm hover:bg-slate-100 rounded-xl">English</button>
          </div>
        </div>
      </div>
    </header>
    <main class="flex-1 px-4 pt-4 pb-32">
      <div class="relative mb-5">
        <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
        <input id="roomSearchInput" type="search" class="w-full pl-11 pr-4 h-12 rounded-full border-0 bg-slate-100 text-sm outline-none focus:bg-white focus:ring-2 focus:ring-indigo-600/30" placeholder="채팅방 검색">
      </div>
      <div class="flex items-center justify-between mb-2.5 px-1">
        <div class="flex items-baseline gap-2 min-w-0">
          <h2 id="roomListHeading" class="text-sm font-bold text-slate-900">채팅방 목록</h2>
          <span id="roomCountLabel" class="text-xs text-slate-500"></span>
        </div>
        <button id="roomEditToggleBtn" type="button" class="text-xs font-semibold text-slate-700 bg-white hover:bg-slate-100 rounded-full px-3.5 py-1.5 whitespace-nowrap soft-card"><i id="roomEditToggleIcon" class="fa-solid fa-pen mr-1"></i><span id="roomEditToggleText">수정</span></button>
      </div>
      <div id="roomList" class="bg-white rounded-3xl overflow-hidden soft-card">
        <div class="text-center text-sm text-slate-400 py-10"><i class="fa-solid fa-spinner fa-spin mr-2"></i><span id="roomLoadingText">채팅방을 불러오는 중...</span></div>
      </div>
      <p class="text-center text-[11px] text-slate-400 mt-6">AI Translation Chat</p>
    </main>
    <div class="fixed bottom-0 left-0 right-0 z-30 pointer-events-none" style="padding: 0 1rem max(1.25rem, env(safe-area-inset-bottom))">
      <div class="max-w-2xl mx-auto pointer-events-auto">
        <button id="createRoomOpenBtn" class="floating-bar w-full h-14 rounded-full bg-indigo-700 hover:bg-indigo-800 active:scale-[.99] transition text-white text-base font-bold flex items-center justify-center gap-2"><i class="fa-solid fa-plus"></i><span id="createRoomButtonText">새 채팅방</span></button>
      </div>
    </div>
  </section>

  <!-- 채팅 화면: 방에 정상 입장한 뒤에만 표시 -->
  <div id="chatApp" class="hidden h-[100dvh] min-h-[420px] flex flex-col overflow-hidden" style="position:fixed; left:0; right:0; margin:0 auto; max-width:42rem; top: var(--app-top, 0px); height: var(--app-h, 100dvh)">
    <header class="px-3 pt-3 pb-2 flex flex-col gap-2.5 z-10 shrink-0">
      <div class="grid grid-cols-[1fr_auto_1fr] items-center gap-2">
        <div class="justify-self-start">
          <button id="roomListBtn" class="h-10 px-4 rounded-full bg-white text-slate-800 text-xs font-semibold hover:bg-slate-100 whitespace-nowrap soft-card"><i class="fa-solid fa-chevron-left mr-1.5"></i><span id="roomListButtonText">목록</span></button>
        </div>
        <div class="min-w-0 max-w-[58vw] text-center">
          <h1 id="uiTitle" class="text-[11px] font-semibold text-slate-500 leading-none mb-1">AI 번역</h1>
          <div id="currentRoomName" class="text-xl font-extrabold text-slate-900 truncate leading-tight tracking-tight"></div>
        </div>
        <div class="justify-self-end">
          <button id="roomSettingsBtn" title="채팅방 설정" class="w-10 h-10 rounded-full bg-white text-slate-700 text-sm hover:bg-slate-100 soft-card"><i class="fa-solid fa-gear"></i></button>
        </div>
      </div>
      <div class="flex items-center justify-between gap-2">
        <button id="changeUserBtn" type="button" class="hdr-pill min-w-0" title="ID">
          <span id="userAvatar" class="user-avatar">U</span>
          <span class="min-w-0 text-left"><span id="uiMyIdLabel" class="pill-label">내 ID</span><span id="userDisplay" class="pill-name">UserA</span></span>
          <i class="fa-solid fa-pen pill-sub"></i>
        </button>
        <div class="relative shrink-0">
          <button id="uiLanguageButton" type="button" class="hdr-pill lang" aria-haspopup="true"><i class="fa-solid fa-globe pill-sub" aria-hidden="true"></i><span id="uiLanguageName">한국어</span><i class="fa-solid fa-chevron-down pill-sub"></i></button>
          <div id="uiLanguagePopup" class="hidden absolute right-0 top-full mt-2 w-44 bg-white rounded-2xl floating-bar p-2 z-50">
            <p id="uiLanguagePopupTitle" class="text-xs text-slate-500 px-2 py-2">화면 언어 선택</p>
            <button type="button" data-ui-lang="ko" class="ui-language-option w-full text-left px-3 py-2 text-sm hover:bg-slate-100 rounded-xl">한국어</button>
            <button type="button" data-ui-lang="zh" class="ui-language-option w-full text-left px-3 py-2 text-sm hover:bg-slate-100 rounded-xl">繁體中文</button>
            <button type="button" data-ui-lang="ja" class="ui-language-option w-full text-left px-3 py-2 text-sm hover:bg-slate-100 rounded-xl">日本語</button>
            <button type="button" data-ui-lang="en" class="ui-language-option w-full text-left px-3 py-2 text-sm hover:bg-slate-100 rounded-xl">English</button>
          </div>
        </div>
      </div>
      <div class="grid grid-cols-2 gap-2 text-xs md:text-sm">
        <div class="flex items-center bg-white soft-card rounded-full px-3.5 py-1.5"><span id="uiSourceLabel" class="text-slate-500 font-medium mr-1.5 shrink-0">입력:</span><select id="sourceLangSelect" class="bg-transparent w-full min-w-0 focus:outline-none font-medium text-slate-700"><option value="ko">한국어</option><option value="zh">대만어 (繁體中文)</option><option value="ja">일본어 (日本語)</option><option value="en">영어 (English)</option></select></div>
        <div class="flex items-center bg-white soft-card rounded-full px-3.5 py-1.5"><span id="uiTargetLabel" class="text-slate-500 font-medium mr-1.5 shrink-0">번역:</span><select id="targetLangSelect" class="bg-transparent w-full min-w-0 focus:outline-none font-medium text-slate-700"><option value="zh">대만어 (繁體中文)</option><option value="ko">한국어</option><option value="ja">일본어 (日本語)</option><option value="en">영어 (English)</option></select></div>
      </div>
    </header>
    <main id="chatContainer" class="flex-1 min-h-0 overflow-y-auto px-4 py-4 flex flex-col gap-3 chat-scroll">
      <div class="text-center my-2"><span id="uiWelcome" class="bg-white text-slate-600 text-xs px-3.5 py-1.5 rounded-full soft-card">채팅방에 연결되었습니다. 대화를 시작하세요!</span></div>
    </main>
    <footer class="px-3 pt-1 z-10 shrink-0 safe-bottom">
      <div id="statusNotice" class="hidden text-xs text-indigo-600 mb-1.5 animate-pulse px-3 items-center gap-1"><i class="fa-solid fa-spinner fa-spin"></i><span id="statusText">AI 번역 중...</span></div>
      <div class="floating-bar bg-white rounded-[1.75rem] p-1.5 flex items-end gap-1.5">
        <button id="micBtn" title="음성 입력" class="w-12 h-12 rounded-full bg-slate-100 text-slate-700 flex items-center justify-center text-lg hover:bg-slate-200 transition-all shrink-0"><i id="micIcon" class="fa-solid fa-microphone"></i></button>
        <textarea id="textInput" rows="1" placeholder="메시지 입력" autocomplete="off" class="flex-1 min-w-0 min-h-12 max-h-32 resize-none overflow-y-auto rounded-2xl px-2 py-3 text-slate-800 text-sm md:text-base focus:outline-none leading-5"></textarea>
        <button id="sendBtn" title="전송" class="w-12 h-12 rounded-full bg-indigo-700 text-white flex items-center justify-center text-lg hover:bg-indigo-800 transition-all shrink-0"><i class="fa-solid fa-paper-plane"></i></button>
      </div>
    </footer>
  </div>

  <!-- 비밀번호 입장 모달 -->
  <div id="entryModal" class="hidden fixed inset-0 modal-backdrop z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-6 w-full max-w-sm floating-bar flex flex-col gap-4">
      <div class="flex items-start gap-3"><div class="w-11 h-11 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center"><i class="fa-solid fa-lock"></i></div><div class="flex-1"><h3 id="entryModalTitle" class="font-bold text-slate-800">비밀번호 입력</h3><p id="entryModalDesc" class="text-xs text-slate-500 mt-1">이 채팅방에 입장하려면 비밀번호를 입력하세요.</p></div></div>
      <input id="entryPasswordInput" type="password" autocomplete="current-password" class="w-full border border-slate-200 bg-slate-50 rounded-2xl px-3 py-3 text-sm outline-none focus:border-indigo-500" placeholder="비밀번호">
      <p id="entryError" class="hidden text-xs text-red-600"></p>
      <div class="flex gap-2"><button id="entryCancelBtn" class="flex-1 px-4 py-3 text-sm font-semibold bg-slate-100 text-slate-700 rounded-full">취소</button><button id="entryConfirmBtn" class="flex-1 px-4 py-3 text-sm font-semibold bg-indigo-600 hover:bg-indigo-700 text-white rounded-full">입장</button></div>
    </div>
  </div>

  <!-- 새 채팅방 생성 모달 -->
  <div id="createRoomModal" class="hidden fixed inset-0 modal-backdrop z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-6 w-full max-w-sm floating-bar flex flex-col gap-4 max-h-[90dvh] overflow-y-auto">
      <div class="flex items-center justify-between"><h3 id="createModalTitle" class="font-bold text-slate-800 text-lg">새 채팅방 만들기</h3><button id="createModalCloseBtn" class="text-slate-400 p-1"><i class="fa-solid fa-xmark"></i></button></div>
      <div><label id="roomNameLabel" for="roomNameInput" class="block text-xs font-medium text-slate-600 mb-1.5">채팅방 이름</label><input id="roomNameInput" maxlength="40" class="w-full border border-slate-200 bg-slate-50 rounded-2xl px-3 py-3 text-sm outline-none focus:border-indigo-500" placeholder="예: 친구들과의 채팅"></div>
      <label class="flex items-center justify-between gap-3 p-3 bg-slate-50 rounded-xl"><span><span id="createPasswordLabel" class="block text-sm font-medium text-slate-700">비밀번호 사용</span><span id="createPasswordHint" class="block text-xs text-slate-500 mt-0.5">필요한 경우 비밀번호를 설정하세요.</span></span><input id="createPasswordToggle" type="checkbox" class="w-5 h-5 accent-indigo-600"></label>
      <div id="createPasswordFields" class="hidden"><label id="newRoomPasswordLabel" for="newRoomPasswordInput" class="block text-xs font-medium text-slate-600 mb-1.5">비밀번호</label><input id="newRoomPasswordInput" type="password" autocomplete="new-password" class="w-full border border-slate-200 bg-slate-50 rounded-2xl px-3 py-3 text-sm outline-none focus:border-indigo-500" placeholder="비밀번호 입력"></div>
      <p id="createRoomError" class="hidden text-xs text-red-600"></p>
      <div class="flex gap-2"><button id="createRoomCancelBtn" class="flex-1 px-4 py-3 text-sm font-semibold bg-slate-100 text-slate-700 rounded-full">취소</button><button id="createRoomSubmitBtn" class="flex-1 px-4 py-3 text-sm font-semibold bg-indigo-600 hover:bg-indigo-700 text-white rounded-full">만들기</button></div>
    </div>
  </div>

  <!-- 채팅방 비밀번호 설정 모달 -->
  <div id="roomSettingsModal" class="hidden fixed inset-0 modal-backdrop z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-6 w-full max-w-sm floating-bar flex flex-col gap-4 max-h-[90dvh] overflow-y-auto">
      <div class="flex items-center justify-between"><h3 id="settingsModalTitle" class="font-bold text-slate-800 text-lg">채팅방 설정</h3><button id="settingsModalCloseBtn" class="text-slate-400 p-1"><i class="fa-solid fa-xmark"></i></button></div>
      <div><label for="settingsRoomNameInput" class="block text-xs font-medium text-slate-600 mb-1.5">채팅방 이름</label><input id="settingsRoomNameInput" maxlength="40" class="w-full border border-slate-200 bg-slate-50 rounded-2xl px-3 py-3 text-sm outline-none focus:border-indigo-500" placeholder="채팅방 이름"></div>
      <div class="p-3 rounded-xl bg-slate-50"><p id="settingsPasswordStatus" class="text-xs text-slate-500"></p></div>
      <div><label id="passwordActionLabel" for="passwordActionSelect" class="block text-xs font-medium text-slate-600 mb-1.5">변경할 설정</label><select id="passwordActionSelect" class="w-full border border-slate-200 bg-slate-50 rounded-2xl px-3 py-3 text-sm bg-white"><option value="enable">비밀번호 켜기</option><option value="disable">비밀번호 끄기</option><option value="change">비밀번호 변경</option></select></div>
      <div id="currentPasswordFields" class="hidden"><label id="currentPasswordLabel" for="currentPasswordInput" class="block text-xs font-medium text-slate-600 mb-1.5">현재 비밀번호</label><input id="currentPasswordInput" type="password" autocomplete="current-password" class="w-full border border-slate-200 bg-slate-50 rounded-2xl px-3 py-3 text-sm outline-none focus:border-indigo-500" placeholder="현재 비밀번호"></div>
      <div id="settingsNewPasswordFields"><label id="settingsNewPasswordLabel" for="settingsNewPasswordInput" class="block text-xs font-medium text-slate-600 mb-1.5">새 비밀번호</label><input id="settingsNewPasswordInput" type="password" autocomplete="new-password" class="w-full border border-slate-200 bg-slate-50 rounded-2xl px-3 py-3 text-sm outline-none focus:border-indigo-500" placeholder="새 비밀번호 입력"></div>
      <p id="settingsError" class="hidden text-xs text-red-600"></p>
      <div class="flex gap-2"><button id="settingsCancelBtn" class="flex-1 px-4 py-3 text-sm font-semibold bg-slate-100 text-slate-700 rounded-full">취소</button><button id="settingsSaveBtn" class="flex-1 px-4 py-3 text-sm font-semibold bg-indigo-600 hover:bg-indigo-700 text-white rounded-full">저장</button></div>
    </div>
  </div>

  <!-- 채팅방 아이콘·배경색 변경 모달 -->
  <div id="iconPickerModal" class="hidden fixed inset-0 modal-backdrop z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-6 w-full max-w-sm floating-bar flex flex-col gap-4 max-h-[90dvh] overflow-y-auto">
      <div class="flex items-center justify-between"><h3 id="iconModalTitle" class="font-bold text-slate-800 text-lg">아이콘 변경</h3><button id="iconModalCloseBtn" class="text-slate-400 p-1"><i class="fa-solid fa-xmark"></i></button></div>
      <div class="flex items-center gap-3">
        <div id="iconPreview" class="w-16 h-16 rounded-2xl flex items-center justify-center text-3xl shrink-0"></div>
        <p id="iconPreviewName" class="text-sm font-semibold text-slate-700 break-words min-w-0"></p>
      </div>

  function closeActiveRoom() {

    lastDateKey = ''; renderedKeys = new Set(); messageStore.clear();
    oldestKey = null; newestKey = null; hasMoreMessages = false; loadingMore = false; historyReady = false; hiddenUnread = 0;
    if (messagesQuery) { messagesQuery.off('child_added', messagesListener); messagesQuery.off('child_changed', changedListener); }
    // 처음에는 최근 PAGE_SIZE개만 불러온다. 이전 대화는 '더보기'를 누를 때 가져온다.
    messagesQuery = activeRoomRef.orderByKey().limitToLast(PAGE_SIZE);
    messagesListener = snapshot => {
      const data = snapshot.val();
      if (!data) return;
      renderMessage(data, snapshot.key, { live: historyReady });
    };
    changedListener = snapshot => { const data = snapshot.val(); if (data) updateMessageElement(snapshot.key, data); };
    messagesQuery.on('child_added', messagesListener, error => console.error('Message listener error:', error));
    messagesQuery.on('child_changed', changedListener);
    setUILanguage(uiLang);
    try {
      const initial = await messagesQuery.once('value');
      if (seq !== enterSeq) return;
      hasMoreMessages = initial.numChildren() >= PAGE_SIZE;
    } catch (error) { console.error('Initial load failed:', error); }
    if (seq !== enterSeq) return;
    // 처음 불러온 메시지를 한 번에 화면에 붙인다.
    if (initialBuffer) { els.chatContainer.appendChild(initialBuffer); initialBuffer = null; }
    historyReady = true;
    updateLoadMoreButton(); maybeMarkRead(); scrollChatToBottom();
  }

  let routeSeq = 0;
  async function routeIntoRequestedRoom() {
    const mySeq = ++routeSeq;
    const roomId = new URLSearchParams(window.location.search).get('room');
    closeModal(els.entryModal);
    closeActiveRoom();
    if (!roomId) {
      els.lobbyScreen.classList.remove('hidden');
      els.chatApp.classList.add('hidden');
      document.title = baseTitle;
      if (!lobbyLoaded) { lobbyLoaded = true; await loadRoomList(); }
      else { renderRoomList(); updateLobbyTitle(); }
      return;
    }
    // Firebase keys cannot contain these characters. Existing room IDs normally do not contain them.
    if (/[.#$\[\]\/]/.test(roomId)) {
      alert(xt().invalidLink);
      leaveToLobby();
      return;
    }
    // 비밀번호 없는 방은 서버 응답을 기다리지 않고 바로 채팅 화면과 로딩 표시를 보여준다.
    const preview = allRooms[roomId];
    if (preview && preview.name && !preview.password) {
      $('currentRoomName').textContent = preview.name;
      els.chatContainer.innerHTML = `<div class="text-center text-sm text-slate-400 py-10"><i class="fa-solid fa-spinner fa-spin mr-2"></i>${safeHtml(t().loading || '...')}</div>`;
      els.lobbyScreen.classList.add('hidden');
      els.chatApp.classList.remove('hidden');
    }
    try {
      // 목록에서 이미 최신 방 정보를 받아 둔 경우에는 서버에 다시 묻지 않는다.
      let meta = (directoryLive && allRooms[roomId] && allRooms[roomId].id) ? Object.assign({}, allRooms[roomId]) : null;
      if (!meta) {
        const snapshot = await directoryRef.child(roomId).once('value');
        if (!snapshot.exists()) {
          // 없는 방 주소로 들어오면 방을 만들지 않고 목록으로 돌려보낸다.
          alert(xt().roomNotFound);
          leaveToLobby();
          return;
        }
        meta = snapshot.val();
      }
      if (mySeq !== routeSeq || new URLSearchParams(window.location.search).get('room') !== roomId) return; // 기다리는 사이 다른 화면으로 이동함
      if (!meta.password) {
        await enterRoom(meta);
        return;
      }
      // 비밀번호가 설정된 방은 URL로 바로 접근해도 항상 비밀번호 입력을 요구한다.
      els.lobbyScreen.classList.add('hidden');
      els.chatApp.classList.add('hidden');
      showEntryPrompt(meta);
    } catch (error) {
      alert(xt().roomLoadFail);
      console.error(error);
      leaveToLobby();
    }
  }

  function showStatus(message) { clearTimeout(statusTimer); els.statusText.textContent = message; els.statusNotice.classList.remove('hidden'); els.statusNotice.classList.add('flex'); }
  function hideStatus() { els.statusNotice.classList.add('hidden'); els.statusNotice.classList.remove('flex'); }
  async function translateText(text, options = {}) {
    const tx = t();
    const targetLang = langMap[els.targetLangSelect.value] || 'English';
    const silent = !!options.silent; // 말풍선에 '번역 중'이 보일 때는 상단 알림을 쓰지 않는다.
    const done = () => { if (!silent) hideStatus(); };
    try {
      if (!silent) showStatus(tx.translating);
      const controller = new AbortController();
      // 첫 글자는 최대 35초 기다리고, 글자가 오기 시작하면 15초 동안 멈출 때만 끊는다.
      let timer;
      const armTimer = ms => { clearTimeout(timer); timer = setTimeout(() => controller.abort(), ms); };
      armTimer(35000);
      try {
        const response = await fetch('/api/translate', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ text, targetLang }), signal:controller.signal });
        done();
        if (!response.ok) {
          if (response.status === 404) return { ok:false, reason: tx.failNotFound };
          if (response.status === 429) return { ok:false, reason: tx.failLimit };
          if (response.status === 504) return { ok:false, reason: tx.failTimeout };
          if ([500,502,503].includes(response.status)) return { ok:false, reason: tx.failServer };
          return { ok:false, reason: tx.failDefault + 'Error (' + response.status + ')' };
        }
        // 서버가 번역을 조각조각 보내 준다. 한 줄마다 JSON이고, done이 와야 성공이다.
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '', translated = '', finished = false;
        const handleLine = line => {
          if (!line.trim()) return;
          const msg = JSON.parse(line);
          if (msg.d) { translated += msg.d; if (options.onPartial) options.onPartial(translated); }
          if (msg.done) finished = true;
        };
        while (true) {
          const { done: end, value } = await reader.read();
          if (end) break;
          armTimer(15000);
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();
          lines.forEach(handleLine);
        }
        handleLine(buffer);
        translated = translated.trim();
        if (!finished) return { ok:false, reason: tx.failServer };
        return translated ? { ok:true, text: translated } : { ok:false, reason: tx.failEmpty };
      } finally { clearTimeout(timer); }
    } catch (error) {
      done();
      if (error.name === 'AbortError') return { ok:false, reason: tx.failTimeout };
      console.error('Translation error:', error);
      return { ok:false, reason: tx.failConnection };
    }
  }

  async function sendMessage(text) {
    if (!activeRoomRef || !text || !text.trim()) return;
    const cleanText = text.trim();
    // 원문을 먼저 보내 바로 화면에 보이게 하고, 번역은 동시에 진행한 뒤 같은 메시지에 채워 넣는다.
    const msgRef = activeRoomRef.push();
    const key = msgRef.key;
    const data = { sender:myUserId, text:cleanText, translatedText:null, timestamp:Date.now() };
    translatingKeys.add(key);
    const savePromise = msgRef.set(data);
    // 번역이 도착하는 대로 내 말풍선에 바로 채워 보여 준다.
    const result = await translateText(cleanText, { silent:true, onPartial: partial => { streamingText.set(key, partial); updateMessageElement(key, data); scrollChatToBottom(); } });
    translatingKeys.delete(key);
    streamingText.delete(key);
    try { await savePromise; }
    catch (error) { console.error('Could not send message:', error); alert(xt().sendFail); return; }
    if (result.ok) {
      try { await msgRef.update({ translatedText: result.text }); }
      catch (error) { console.error('Could not save translation:', error); updateMessageElement(key, data); }
    } else {
      // 번역에 실패하면 원문만 남기고 '다시 번역' 버튼을 보여 준다.
      updateMessageElement(key, data);
      showStatus(result.reason + ' ' + xt().sentWithoutTranslation);
      clearTimeout(statusTimer); statusTimer = setTimeout(hideStatus, 5000);
    }
  }
  $('sendBtn').addEventListener('click', async () => {
    const val = els.textInput.value.trim(); if (!val) return;
    els.textInput.value = ''; resizeTextInput(); await sendMessage(val);
  });
  els.textInput.addEventListener('keydown', event => {
    if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) { event.preventDefault(); $('sendBtn').click(); }
  });
  els.textInput.addEventListener('input', resizeTextInput);
  function resizeTextInput() {
    els.textInput.style.height = '48px';
    const maxHeight = 128;
    const newHeight = Math.min(els.textInput.scrollHeight, maxHeight);
    els.textInput.style.height = newHeight + 'px';
    els.textInput.style.overflowY = els.textInput.scrollHeight > maxHeight ? 'auto' : 'hidden';
  }
  function scrollChatToBottom() { requestAnimationFrame(() => { els.chatContainer.scrollTop = els.chatContainer.scrollHeight; requestAnimationFrame(() => { els.chatContainer.scrollTop = els.chatContainer.scrollHeight; }); }); }

  function fillBubble(bubble, data, isMine, key) {
    const x = xt();
    let html = `<div class="text-xs md:text-sm ${isMine ? 'text-indigo-200' : 'text-slate-400'} font-normal break-words leading-relaxed">${safeHtml(data.text || '')}</div>`;
    if (data.translatedText) {
      html += `<div class="mt-1 pt-1 border-t ${isMine ? 'border-indigo-500/50 text-white' : 'border-slate-200/80 text-indigo-700'} text-base md:text-lg font-normal break-words leading-snug flex items-start gap-1.5"><i class="fa-solid fa-language text-xs opacity-75 mt-1 shrink-0"></i><span class="translated-text min-w-0 flex-1">${safeHtml(data.translatedText)}</span><button type="button" class="copy-translation-btn relative shrink-0 w-7 h-7 -mr-2 rounded-lg flex items-center justify-center text-xs transition ${isMine ? 'text-indigo-200 hover:text-white hover:bg-white/15' : 'text-slate-400 hover:text-indigo-600 hover:bg-indigo-50'}" title="${safeHtml(x.copyTranslation)}" aria-label="${safeHtml(x.copyTranslation)}"><i class="fa-regular fa-copy"></i></button></div>`;
    } else if (isMine && key && translatingKeys.has(key)) {
      // 방금 보낸 메시지는 번역이 끝날 때까지 '번역 중'을 보여 주고, 도착한 번역은 먼저 채워 넣는다.
      if (streamingText.get(key)) {
        html += `<div class="mt-1 pt-1 border-t border-indigo-500/50 text-white text-base md:text-lg font-normal break-words leading-snug flex items-start gap-1.5"><i class="fa-solid fa-language text-xs opacity-75 mt-1 shrink-0"></i><span class="min-w-0 flex-1">${safeHtml(streamingText.get(key))}</span></div>`;
      } else {
        html += `<div class="mt-1.5 text-xs text-indigo-100 flex items-center gap-1.5"><i class="fa-solid fa-spinner fa-spin text-[10px]"></i><span>${safeHtml(t().translating)}</span></div>`;
      }
    } else if (isMine) {
      // 내 메시지인데 번역이 없으면(번역 실패) 다시 번역할 수 있다.
      html += `<div class="mt-1.5"><button type="button" class="retry-translate-btn inline-flex items-center gap-1.5 text-xs font-medium px-2.5 py-1 rounded-full bg-white/15 hover:bg-white/25 text-white transition"><i class="fa-solid fa-rotate-right text-[10px]"></i><span>${safeHtml(x.retryTranslate)}</span></button></div>`;
    }
    bubble.innerHTML = html;
  }
  function buildMessageElement(data, key) {
    const tx = t();
    const isMine = data.sender === myUserId;
    const wrap = document.createElement('div');
    wrap.className = `flex flex-col ${isMine ? 'items-end' : 'items-start'} my-1`;
    wrap.dataset.chatMessage = 'true'; wrap.dataset.messageTimestamp = String(data.timestamp || ''); wrap.dataset.key = key || '';
    const sender = document.createElement('span'); sender.className = 'text-xs font-semibold text-slate-600 mb-1 px-1'; sender.textContent = isMine ? tx.me : (data.sender || '');
    const row = document.createElement('div'); row.className = `flex items-end gap-1.5 w-full ${isMine ? 'justify-end' : 'justify-start'}`;
    const bubble = document.createElement('div'); bubble.className = (isMine ? 'bg-indigo-700 text-white rounded-3xl rounded-br-lg px-4 py-2.5 max-w-[85%] soft-card' : 'bg-white text-slate-800 rounded-3xl rounded-bl-lg px-4 py-2.5 max-w-[85%] soft-card') + ' msg-bubble';
    fillBubble(bubble, data, isMine, key);
    const time = document.createElement('span'); time.className = 'text-[10px] text-slate-400 whitespace-nowrap shrink-0 pb-0.5'; time.dataset.messageTimestamp = String(data.timestamp || ''); time.textContent = formatMessageTime(data.timestamp);
    if (isMine) { row.appendChild(time); row.appendChild(bubble); } else { row.appendChild(bubble); row.appendChild(time); }
    wrap.appendChild(sender); wrap.appendChild(row);
    return wrap;
  }
  function renderMessage(data, key, options = {}) {
    if (key) {
      if (renderedKeys.has(key)) return;
      renderedKeys.add(key); messageStore.set(key, data);
      if (!oldestKey || key < oldestKey) oldestKey = key;
      if (!newestKey || key > newestKey) newestKey = key;
    }
    const isMine = data.sender === myUserId;
    const box = els.chatContainer;
    // 위쪽 이전 대화를 보고 있을 때는 새 메시지가 와도 화면을 아래로 끌어내리지 않는다.
    const stick = !historyReady || isMine || (box.scrollHeight - box.scrollTop - box.clientHeight < 160);
    const wrap = buildMessageElement(data, key);
    const stamp = Number(data.timestamp);
    // 입장 직후 처음 불러오는 동안에는 임시 공간에 모아 두었다가 한 번에 붙인다.
    const target = (!historyReady && initialBuffer) ? initialBuffer : box;
    if (stamp) {
      const s = timeSettings();
      const dayKey = dateKeyOf(stamp, s);
      if (dayKey !== lastDateKey) { target.appendChild(makeDateSeparator(stamp, s)); lastDateKey = dayKey; }
    }
    target.appendChild(wrap);
    if (stick && target === box) scrollChatToBottom();
    if (options.live && !isMine && document.hidden) { hiddenUnread++; updateChatTitle(); }
    if (historyReady) maybeMarkRead();
  }
  function updateMessageElement(key, data) {
    messageStore.set(key, data);
    // 아직 임시 공간에 있는 메시지도 찾을 수 있게 둘 다 확인한다.
    const selector = '[data-chat-message="true"][data-key="' + String(key).replace(/["\\]/g, '\\$&') + '"]';
    const wrap = els.chatContainer.querySelector(selector) || (initialBuffer && initialBuffer.querySelector(selector));
    if (!wrap) return;
    const bubble = wrap.querySelector('.msg-bubble');
    if (bubble) fillBubble(bubble, data, data.sender === myUserId, key);
  }
  function updateLoadMoreButton() {
    const wrap = $('loadMoreWrap'), btn = $('loadMoreBtn');
    if (!wrap || !btn) return;
    wrap.classList.toggle('hidden', !hasMoreMessages);
    btn.disabled = loadingMore;
    const icon = btn.querySelector('i');
    if (icon) icon.className = loadingMore ? 'fa-solid fa-spinner fa-spin text-[11px]' : 'fa-solid fa-clock-rotate-left text-[11px]';
  }
  async function loadOlderMessages() {
    if (loadingMore || !hasMoreMessages || !oldestKey || !activeRoomRef) return;
    loadingMore = true; updateLoadMoreButton();
    try {
      const snap = await activeRoomRef.orderByKey().endAt(oldestKey).limitToLast(PAGE_SIZE + 1).once('value');
      const items = [];
      snap.forEach(child => { if (child.key !== oldestKey && !renderedKeys.has(child.key)) items.push({ key: child.key, data: child.val() }); });
      hasMoreMessages = snap.numChildren() >= PAGE_SIZE + 1;
      const box = els.chatContainer, prevHeight = box.scrollHeight, prevTop = box.scrollTop;
      const fragment = document.createDocumentFragment();
      items.forEach(({ key, data }) => {
        if (!data) return;
        renderedKeys.add(key); messageStore.set(key, data);
        if (!oldestKey || key < oldestKey) oldestKey = key;
        fragment.appendChild(buildMessageElement(data, key));
      });
      const anchor = $('loadMoreWrap');
      anchor.parentNode.insertBefore(fragment, anchor.nextSibling);
      refreshMessageTimes();
      box.scrollTop = prevTop + (box.scrollHeight - prevHeight); // 보던 위치 유지
    } catch (error) {
      console.error('Load older failed:', error); alert(xt().loadMoreFail);
    } finally { loadingMore = false; updateLoadMoreButton(); }
  }

  // ---- 읽음 표시 / 탭 제목 알림 ----
  function maybeMarkRead() {
    if (activeRoomId && newestKey && document.visibilityState === 'visible') writeLastRead(activeRoomId, newestKey);
  }
  function updateChatTitle() {
    const name = activeRoomMeta ? (activeRoomMeta.name || activeRoomMeta.id) : '';
    document.title = hiddenUnread > 0 ? '(' + (hiddenUnread > 99 ? '99+' : hiddenUnread) + ') ' + xt().newMessage + (name ? ' · ' + name : '') : baseTitle;
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible' || !activeRoomId) return;
    hiddenUnread = 0; updateChatTitle(); maybeMarkRead();
  });

  // ---- 번역문 복사 / 다시 번역 ----
  async function handleCopy(btn) {
    const textEl = btn.parentElement && btn.parentElement.querySelector('.translated-text');
    const text = textEl ? textEl.textContent : '';
    if (!text) return;
    let copied = false;
    try { await navigator.clipboard.writeText(text); copied = true; }
    catch (error) {
      try {
        const area = document.createElement('textarea');
        area.value = text; area.style.position = 'fixed'; area.style.opacity = '0';
        document.body.appendChild(area); area.select(); copied = document.execCommand('copy'); area.remove();
      } catch (fallbackError) {}
    }
    if (!copied) return;
    clearTimeout(btn._copyTimer);
    const icon = btn.querySelector('i'); if (icon) icon.className = 'fa-solid fa-check';
    let toast = btn.querySelector('.copy-toast');
    if (!toast) {
      toast = document.createElement('span');
      toast.className = 'copy-toast absolute right-0 -top-8 px-2 py-1 rounded-md bg-slate-800 text-white text-[11px] font-medium whitespace-nowrap shadow-lg pointer-events-none';
      btn.appendChild(toast);
    }
    toast.textContent = xt().copied;
    btn._copyTimer = setTimeout(() => { if (icon) icon.className = 'fa-regular fa-copy'; if (toast) toast.remove(); }, 1400);
  }
  async function retryTranslation(btn) {
    const wrap = btn.closest('[data-chat-message="true"]');
    const key = wrap && wrap.dataset.key;
    const data = key && messageStore.get(key);
    if (!data || btn.disabled || !activeRoomRef) return;
    btn.disabled = true;
    const icon = btn.querySelector('i'); if (icon) icon.classList.add('fa-spin');
    const result = await translateText(data.text);
    if (!result.ok) {
      showStatus(result.reason); statusTimer = setTimeout(hideStatus, 5000);
      btn.disabled = false; if (icon) icon.classList.remove('fa-spin');
      return;
    }
    try {
      await activeRoomRef.child(key).update({ translatedText: result.text });
      updateMessageElement(key, Object.assign({}, data, { translatedText: result.text }));
    } catch (error) {
      console.error('Retry save failed:', error); alert(xt().sendFail);
      btn.disabled = false; if (icon) icon.classList.remove('fa-spin');
    }
  }
  els.chatContainer.addEventListener('click', event => {
    if (event.target.closest('#loadMoreBtn')) { loadOlderMessages(); return; }
    const copyBtn = event.target.closest('.copy-translation-btn'); if (copyBtn) { handleCopy(copyBtn); return; }
    const retryBtn = event.target.closest('.retry-translate-btn'); if (retryBtn) retryTranslation(retryBtn);
  });

  function dateKeyOf(stamp, s) {
    const p = new Intl.DateTimeFormat('en-US', { timeZone:s.zone, year:'numeric', month:'2-digit', day:'2-digit' }).formatToParts(new Date(stamp)).reduce((o,x) => { o[x.type] = x.value; return o; }, {});
    return `${p.year}-${p.month}-${p.day}`;
  }
  function makeDateSeparator(stamp, s) {
    const sep = document.createElement('div'); sep.className = 'message-date-separator flex justify-center my-4 w-full';
    const label = document.createElement('span'); label.className = 'bg-white text-slate-600 text-xs px-3.5 py-1.5 rounded-full soft-card';
    label.textContent = new Date(stamp).toLocaleDateString(s.locale, { timeZone:s.zone, year:'numeric', month:'long', day:'numeric', weekday:'long' });
    sep.appendChild(label);
    return sep;
  }
  function timeSettings() { return ({ ko:{locale:'ko-KR',zone:'Asia/Seoul'}, zh:{locale:'zh-TW',zone:'Asia/Taipei'}, ja:{locale:'ja-JP',zone:'Asia/Tokyo'}, en:{locale:'en-US',zone:'America/New_York'} })[uiLang] || {locale:'ko-KR',zone:'Asia/Seoul'}; }
  function formatMessageTime(timestamp) {
    if (!timestamp) return '';
    const s = timeSettings();
    return new Date(Number(timestamp)).toLocaleTimeString(s.locale, { timeZone:s.zone, hour:'numeric', minute:'2-digit', hour12:true });
  }
  // 화면 언어를 바꿀 때만 전체 메시지의 시간 표시와 날짜 구분선을 다시 계산한다.
  function refreshMessageTimes() {
    const s = timeSettings();
    const messages = Array.from(els.chatContainer.querySelectorAll('[data-chat-message="true"]'));
    els.chatContainer.querySelectorAll('.message-date-separator').forEach(node => node.remove());
    let lastKey = '';
    messages.forEach(message => {
      const stamp = Number(message.dataset.messageTimestamp); if (!stamp) return;
      const key = dateKeyOf(stamp, s);
      const time = message.querySelector('[data-message-timestamp]'); if (time) time.textContent = formatMessageTime(stamp);
      if (key !== lastKey) { els.chatContainer.insertBefore(makeDateSeparator(stamp, s), message); lastKey = key; }
    });
    lastDateKey = lastKey;
  }

  // 음성 입력 (브라우저가 지원하는 경우)
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SpeechRecognition) {
    // 안드로이드는 continuous 모드에서 같은 문장을 점점 길게 여러 번 확정해서 보내 중복 입력되므로, 한 문장씩 듣고 onend에서 다시 시작
    const isMobileSTT = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    recognition = new SpeechRecognition(); recognition.continuous = !isMobileSTT; recognition.interimResults = true;
    let sttBaseText = '';
    function updateSTTLanguage() { recognition.lang = ({ko:'ko-KR',zh:'zh-TW',ja:'ja-JP',en:'en-US'})[els.sourceLangSelect.value] || 'ko-KR'; }
    function stopRecordingUI() { els.micBtn.classList.remove('recording-active'); els.micIcon.className = 'fa-solid fa-microphone'; els.textInput.placeholder = t().inputPlaceholder; }
    els.micBtn.addEventListener('click', () => {
      if (!activeRoomId) return;
      if (!isRecording) { isManualStop = false; updateSTTLanguage(); try { recognition.start(); } catch (error) { console.warn('STT start:', error); } }
      else { isManualStop = true; isRecording = false; try { recognition.stop(); recognition.abort(); } catch (error) {} stopRecordingUI(); }
    });
    recognition.onstart = () => { sttBaseText = els.textInput.value.trim(); isRecording = true; els.micBtn.classList.add('recording-active'); els.micIcon.className = 'fa-solid fa-square'; els.textInput.placeholder = t().listening; };
    recognition.onend = () => { if (!isManualStop && isRecording) { try { recognition.start(); } catch (error) { isRecording = false; stopRecordingUI(); } } else { isRecording = false; stopRecordingUI(); } };
    recognition.onresult = event => {
      // 인식 세션 시작 때의 입력창 내용 뒤에, 인식 중인 글자(임시 결과 포함)를 실시간으로 덧씌운다.
      let spoken = '';
      for (let i = 0; i < event.results.length; i++) spoken += event.results[i][0].transcript;
      spoken = spoken.trim();
      els.textInput.value = sttBaseText && spoken ? sttBaseText + ' ' + spoken : sttBaseText + spoken; resizeTextInput();
    };
    recognition.onerror = event => {
      console.warn('Speech recognition:', event.error);
      if (!isManualStop && ['no-speech','network'].includes(event.error)) { try { recognition.start(); } catch (error) {} }
      else if (isManualStop || ['not-allowed','service-not-allowed'].includes(event.error)) { isRecording = false; stopRecordingUI(); }
    };
  } else {
    els.micBtn.disabled = true; els.micBtn.classList.add('opacity-50','cursor-not-allowed');
  }

  // 첫 화면 언어 설정과 진입 초기화
  setUILanguage(uiLang);
  routeIntoRequestedRoom();
})();
</script>
<script>
  // 모바일 브라우저는 하단 툴바 때문에 100dvh가 실제 보이는 높이와 다를 수 있어서, 실제 높이를 직접 재서 사용
  (function () {
    function setAppHeight() {
      const vv = window.visualViewport;
      const h = (vv && vv.height) || window.innerHeight;
      const top = (vv && vv.offsetTop) || 0;
      document.documentElement.style.setProperty('--app-h', h + 'px');
      document.documentElement.style.setProperty('--app-top', top + 'px');
    }
    setAppHeight();
    window.addEventListener('resize', setAppHeight);
    window.addEventListener('orientationchange', setAppHeight);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', setAppHeight);
      window.visualViewport.addEventListener('scroll', setAppHeight);
    }
  })();
</script>
</body>
</html>
